name: api-gateway
replicas: 1
image: kacho-api-gateway:dev
imagePullPolicy: IfNotPresent

port: 8080

# Адреса backend-сервисов (KACHO_*_GRPC env vars)
backends:
  resourceManager: resource-manager.kacho.svc.cluster.local:9090
  vpc: vpc.kacho.svc.cluster.local:9090
  compute: compute.kacho.svc.cluster.local:9090
  loadbalancer: loadbalancer.kacho.svc.cluster.local:9090

ingress:
  enabled: true
  host: api.kacho.local
  # nginx.ingress.kubernetes.io/proxy-read-timeout нужен для Watch-стримов (acceptance OQ-5)
  proxyReadTimeout: "120"
