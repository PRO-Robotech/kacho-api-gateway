name: api-gateway
replicas: 1
image: kacho-api-gateway:dev
imagePullPolicy: IfNotPresent

port: 8080

# Адреса активных backend-сервисов (KACHO_API_GATEWAY_*_GRPC env vars).
# Compute и loadbalancer заморожены — их адреса здесь отсутствуют.
backends:
  resourceManager: resource-manager.kacho.svc.cluster.local:9090
  vpc: vpc.kacho.svc.cluster.local:9090

ingress:
  enabled: true
  host: api.kacho.local
  proxyReadTimeout: "120"
