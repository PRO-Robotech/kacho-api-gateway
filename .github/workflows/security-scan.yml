name: security-scan

# KAC-127 Phase 12 — Security scan gates for api-gateway.

on:
  push:
    branches: [main, KAC-*]
  pull_request:

permissions:
  contents: read
  security-events: write
  pull-requests: write

defaults:
  run:
    working-directory: kacho-api-gateway

jobs:
  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { path: kacho-api-gateway }
      - uses: actions/checkout@v6
        with: { repository: PRO-Robotech/kacho-corelib, ref: main, path: kacho-corelib }
      # Transitional pin: gateway registers the public iam.v1 UserService.Update RPC
      # added in proto#89. Revert to `ref: main` once proto#89 merges.
      - uses: actions/checkout@v6
        with: { repository: PRO-Robotech/kacho-proto, ref: unify-iam-label-scope, path: kacho-proto }
      - uses: actions/setup-go@v6
        with: { go-version-file: kacho-api-gateway/go.mod }
      - run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          "$(go env GOPATH)/bin/gosec" -fmt sarif -out gosec.sarif ./... || true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: kacho-api-gateway/gosec.sarif, category: gosec }

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { path: kacho-api-gateway }
      - uses: aquasecurity/trivy-action@master  # KAC-127 — previous "0.30.0" failed (action publishes only v-prefixed tags v0.28.0..v0.36.0; no plain "0.30.0" ref). Using @master per upstream README recommendation.
        with:
          scan-type: 'fs'
          scan-ref: 'kacho-api-gateway'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy-fs.sarif, category: trivy-fs }

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { path: kacho-api-gateway }
      - uses: actions/checkout@v6
        with: { repository: PRO-Robotech/kacho-corelib, ref: main, path: kacho-corelib }
      # Transitional pin: gateway registers the public iam.v1 UserService.Update RPC
      # added in proto#89. Revert to `ref: main` once proto#89 merges.
      - uses: actions/checkout@v6
        with: { repository: PRO-Robotech/kacho-proto, ref: unify-iam-label-scope, path: kacho-proto }
      - uses: actions/setup-go@v6
        with: { go-version-file: kacho-api-gateway/go.mod }
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" -mode=source -format=sarif ./... > govulncheck.sarif || true
          # govulncheck emits duplicate entries in rule properties.tags, which
          # the codeql SARIF validator rejects ("contains duplicate item").
          # It also emits nothing on a build error. Sanitize: dedupe every
          # rule's properties.tags, or substitute an empty schema-valid doc.
          if jq -e . govulncheck.sarif >/dev/null 2>&1; then
            jq '(.runs[].tool.driver.rules[]?.properties.tags) |= (if . then unique else . end)' \
              govulncheck.sarif > govulncheck.sanitized.sarif && mv govulncheck.sanitized.sarif govulncheck.sarif
          else
            echo "govulncheck produced no/invalid SARIF — substituting empty document"
            printf '%s' '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"govulncheck","rules":[]}},"results":[]}]}' > govulncheck.sarif
          fi
          fnd=$(jq '[.runs[].results[]?] | length' govulncheck.sarif)
          echo "govulncheck findings: $fnd"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: kacho-api-gateway/govulncheck.sarif, category: govulncheck }
